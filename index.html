<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আল আকসা মাদরাসা - সাভার শাখা</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Noto Sans Bengali';
    src: local('Noto Sans Bengali');
  }

  body {
    font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #145c45 0%, #0a3527 65%, #062017 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 44px 32px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #0f4c3a, #d4af37, #0f4c3a);
  }

  .badge {
    display: inline-block;
    background: #eef7f2;
    color: #0f4c3a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 22px;
    color: #0f2e22;
    margin-bottom: 6px;
    line-height: 1.5;
    font-weight: 700;
  }

  .branch {
    font-size: 15px;
    color: #d4af37;
    font-weight: 700;
    margin-bottom: 10px;
  }

  p.subtitle {
    color: #6b7c74;
    font-size: 14px;
    margin-bottom: 32px;
  }

  a.link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 17px;
    margin-bottom: 14px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }

  a.link-btn:active { transform: scale(0.97); }

  .youtube { background: #FF0000; color: #fff; }
  .facebook { background: #1877F2; color: #fff; }

  .icon { width: 22px; height: 22px; flex-shrink: 0; }

  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #a3ada7;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">অফিসিয়াল পেজ</span>
    <h1>আল আকসা মাদরাসা</h1>
    <div class="branch">সাভার শাখা</div>
    <p class="subtitle">আমাদের সাথে যুক্ত থাকুন</p>

    <a class="link-btn youtube" href="https://www.youtube.com/@alaqsa-v6i" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="white"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
      YouTube চ্যানেল
    </a>

    <a class="link-btn facebook" href="https://www.facebook.com/share/1K1v6L9G5S/" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="white"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
      Facebook পেজ
    </a>

    <footer>আল আকসা মাদরাসা<br>সাভার শাখা</footer>
  </div>
</body>
</html>
